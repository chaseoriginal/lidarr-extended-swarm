x-base: &base
  restart: unless-stopped
  networks:
    - lidarr-extended-swarm_default

services:
  lidarr:
    <<: *base
    image: linuxserver/lidarr:nightly
    container_name: ${CNAME}
    user: ${PUID}:${PGID}
    environment:
      - TZ=${TZ}
    volumes:
      - lidarr.config:/config
      - lidarr.custom-services:/custom-services.d
      - lidarr.custom-cont-init.d:/custom-cont-init.d
      - /media/Multimedia/Music:/music
      - /media/Multimedia/Incoming:/downloads
    ports:
      - target: 8686
        published: 8686
        protocol: tcp
        mode: host
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.labels.deployment.target.lidarr == true
      restart_policy:
        condition: on-failure

volumes:
  lidarr.config:
    name: lidarr.config
  lidarr.custom-services:
    name: lidarr.custom-services
  lidarr.custom-cont-init.d:
    name: lidarr.custom-cont-init.d

networks:
  lidarr-extended-swarm_default:
    external: true
    name: lidarr-extended-swarm_default
