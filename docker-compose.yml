x-base:
  restart: unless-stopped
  networks: &id001
  - lidarr-extended-swarm_default
services:
  lidarr:
    restart: unless-stopped
    networks: *id001
    image: linuxserver/lidarr:nightly
    container_name: lidarr-extended-swarm_lidarr
    user: ${PUID}:${PGID}
    environment:
    - TZ=${TZ}
    - PUID=1000
    - PGID=1000
    volumes:
    - lidarr-extended-swarm_lidarr.config:/config
    - /media/Multimedia/Music:/music
    - /media/Multimedia/Incoming:/downloads
    ports:
    - target: 8686
      published: 8686
      protocol: tcp
      mode: host
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
        - node.role==manager
      restart_policy:
        condition: on-failure
networks:
  lidarr-extended-swarm_default:
    external: true
    name: lidarr-extended-swarm_default
volumes:
  lidarr-extended-swarm_lidarr.config:
    name: lidarr-extended-swarm_lidarr.config
