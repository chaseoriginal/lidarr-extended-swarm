x-base: &base
  restart: unless-stopped
  networks:
    - lidarr-extended-swarm_default

services:
  lidarr:
    <<: *base
    image: linuxserver/lidarr:nightly
    container_name: ${CNAME}
    user: ${PUID}:${PGID}
    environment:
      - TZ=${TZ}
    volumes:
      - type: bind
        source: /var/lib/docker/volumes/lidarr-extended-swarm_lidarr.config
        target: /config
      - type: bind
        source: /var/lib/docker/volumes/lidarr-extended-swarm_lidarr.custom-services
        target: /custom-services.d
      - type: bind
        source: /var/lib/docker/volumes/lidarr-extended-swarm_lidarr.custom-cont-init.d
        target: /custom-cont-init.d
      - type: bind
        source: /media/Multimedia/Music
        target: /music
      - type: bind
        source: /media/Multimedia/Incoming
        target: /downloads
    ports:
      - target: 8686
        published: 8686
        protocol: tcp
        mode: host
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.labels.deployment.target.lidarr-extended == true
      restart_policy:
        condition: on-failure

networks:
  lidarr-extended-swarm_default:
    external: true
    name: lidarr-extended-swarm_default
